name: Build wheels

on:
 push:
  tags:
   - 'v*'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.0
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_LINUX: auto aarch64
          CIBW_ARCHS_MACOS: x86_64 universal2 arm64
          CIBW_BUILD: |
            cp39-macosx_universal2  cp39-win_amd64  cp39-win32  cp39-manylinux_x86_64  cp39-manylinux_i686  cp39-manylinux_aarch64
            cp310-macosx_universal2 cp310-win_amd64 cp310-win32 cp310-manylinux_x86_64 cp310-manylinux_i686 cp310-manylinux_aarch64
            cp311-macosx_universal2 cp311-win_amd64 cp311-win32 cp311-manylinux_x86_64 cp311-manylinux_i686 cp311-manylinux_aarch64
            cp312-macosx_universal2 cp312-win_amd64 cp312-win32 cp312-manylinux_x86_64 cp312-manylinux_i686 cp312-manylinux_aarch64
            cp313-macosx_universal2 cp313-win_amd64 cp313-win32 cp313-manylinux_x86_64 cp313-manylinux_i686 cp313-manylinux_aarch64
            cp314-macosx_universal2 cp314-win_amd64 cp314-win32 cp314-manylinux_x86_64 cp314-manylinux_i686 cp314-manylinux_aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  github-release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/v')"
    needs: [ build_wheels ]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          files: '*.whl'
